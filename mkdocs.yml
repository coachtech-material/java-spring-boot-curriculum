site_name: COACHTECH × Java / Spring Boot ガイド
site_description: Laravel 経験者のための Java / Spring Boot バックエンド開発教材
site_url: https://coachtech-material.github.io/java-spring-boot-curriculum/

docs_dir: docs

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon: {}

extra:
  generator: false

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - トップ: index.md
  - Part 1 Java 言語の基礎:
    - Chapter 1 オリエンテーションと Java という言語:
      - 1-1-1 なぜ Java / Spring Boot を学ぶのか: part-01/chapter-01/1-1-1.md
      - 1-1-2 Java という言語の正体: part-01/chapter-01/1-1-2.md
      - 1-1-3 Java プロジェクトの形: part-01/chapter-01/1-1-3.md
      - 1-1-4 JShell で Java を動かす（任意ハンズオン）: part-01/chapter-01/1-1-4.md
    - Chapter 2 基本文法:
      - 1-2-1 変数と型: part-01/chapter-02/1-2-1.md
      - 1-2-2 演算子と制御構文: part-01/chapter-02/1-2-2.md
      - 1-2-3 メソッドと配列・文字列: part-01/chapter-02/1-2-3.md
    - Chapter 3 コレクションと例外処理:
